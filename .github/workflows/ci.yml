name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ci-verify-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: true
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Select validation from the Git comparison
        id: changes
        run: node scripts/ci-changes.mjs
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install JavaScript dependencies
        run: just setup-js
      - name: Check documentation only
        if: steps.changes.outputs.docs_only == 'true'
        run: just check-docs
      - name: Install pinned Rust dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          rustup show active-toolchain
          cargo fetch --locked
      - name: Check formatting, types and boundaries
        if: steps.changes.outputs.docs_only != 'true' && github.event_name != 'workflow_dispatch'
        run: just check
      - name: Run unit tests
        if: steps.changes.outputs.docs_only != 'true' && github.event_name != 'workflow_dispatch'
        run: just test-unit
      - name: Run database contracts
        if: steps.changes.outputs.database == 'true' && github.event_name != 'workflow_dispatch'
        run: just test-db
      - name: Install Chromium and system dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build without credentials
        if: steps.changes.outputs.docs_only != 'true' && github.event_name != 'workflow_dispatch'
        run: just build
      - name: Run production smoke journeys
        if: steps.changes.outputs.docs_only != 'true' && github.event_name != 'workflow_dispatch'
        run: env -u E2E_STATE E2E_PRODUCTION=1 pnpm test:e2e --grep @smoke
      - name: Run exhaustive verification on demand
        if: github.event_name == 'workflow_dispatch'
        run: just verify-full
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://gradavia.com
    concurrency:
      group: gradavia-production
      cancel-in-progress: false
      queue: max
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install locked dependencies
        run: just setup
      - name: Install Chromium for the public production smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and validate both releases before publishing
        run: just cf-check cf-api-image
      - name: Check this application release is still current
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          git fetch origin "$latest_sha"
          LATEST_SHA="$latest_sha" node scripts/ci-changes.mjs --release
      - name: Publish the private API, then the prebuilt website
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the production CLOUDFLARE_API_TOKEN secret before deploying."
            exit 1
          fi
          just cf-api-deploy
          just cf-web-publish
      - name: Verify public production data and routing
        if: steps.release.outputs.current == 'true'
        run: just cf-smoke
      - name: Preserve production smoke diagnostics
        if: always() && steps.release.outputs.current == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.run_attempt }}
          path: .artifacts/cloudflare/smoke/
          if-no-files-found: ignore
          retention-days: 7
